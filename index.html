<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<meta name="robots" content="noindex, nofollow">
<title>Céges teendők</title>
<style>
:root{
  --bg:#f4f5f7; --card:#ffffff; --text:#1c2230; --muted:#667085; --line:#e3e6ec;
  --accent:#2457d6; --accent-soft:#e7eeff;
  --green:#15803d; --green-soft:#e3f6ea; --red:#c62828; --red-soft:#fdeaea;
  --amber:#b45309; --amber-soft:#fff3d9; --blue-soft:#e4efff; --purple-soft:#efe8ff; --orange-soft:#ffeadb;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#111418; --card:#1a1f26; --text:#e8ebf0; --muted:#97a0ae; --line:#2b323c;
    --accent:#6b93ff; --accent-soft:#1f2b4d;
    --green:#4ade80; --green-soft:#16301f; --red:#ff8a80; --red-soft:#3a1c1c;
    --amber:#fbbf24; --amber-soft:#3a2d12; --blue-soft:#1b2d4d; --purple-soft:#2c2347; --orange-soft:#3d2a1a;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
.muted{color:var(--muted)}
.small{font-size:13px}

/* gombok, mezők */
.btn{border:1px solid var(--line);background:var(--card);padding:8px 14px;border-radius:9px;cursor:pointer;box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--red);border-color:var(--red)}
.btn.small{padding:5px 10px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
.icon{border:0;background:transparent;cursor:pointer;padding:6px 8px;border-radius:8px;color:var(--muted);font-size:15px}
.icon:hover{background:var(--accent-soft);color:var(--accent)}
input[type=text],input[type=email],input[type=password],input[type=search],input[type=number],input[type=date],select,textarea{
  width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:9px;background:var(--card)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:-1px}
input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer}
.tag{display:inline-block;font-size:11px;font-weight:600;padding:1px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent);vertical-align:middle}

/* belépés */
.authwrap{min-height:100vh;display:grid;place-items:center;padding:20px}
.authcard{background:var(--card);padding:28px;border-radius:16px;width:100%;max-width:380px;box-shadow:var(--shadow);display:grid;gap:14px;border:1px solid var(--line)}
.authcard h1{margin:0;font-size:22px}
.authcard label,.form label{display:grid;gap:5px;font-size:13px;color:var(--muted)}
.err{color:var(--red);min-height:18px;font-size:13px}

/* fejléc */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 20px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.brand{font-weight:700;font-size:17px}
#nav{display:flex;gap:4px;flex-wrap:wrap;flex:1}
#nav button{border:0;background:transparent;padding:8px 14px;border-radius:9px;cursor:pointer;color:var(--muted);font-weight:500}
#nav button:hover{background:var(--bg)}
#nav button.on{background:var(--accent-soft);color:var(--accent)}
.user{display:flex;align-items:center;gap:8px;font-size:14px}
main{max-width:1180px;margin:0 auto;padding:18px 20px 60px}

/* eszköztár */
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.toolbar select{width:auto;min-width:150px}
.toolbar input[type=search]{width:200px}
.toolbar label.chk{display:flex;gap:6px;align-items:center;font-size:14px;cursor:pointer}
.toolbar .grow{flex:1}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow)}
.empty{padding:26px;text-align:center;color:var(--muted)}
.empty.small{padding:6px;font-size:13px}

/* haladás + jelmagyarázat */
.stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:12px}
.stat{flex:1;min-width:230px;padding:12px 14px}
.stat .top2{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:6px}
.bar{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.g i{background:var(--green)} .bar.r i{background:var(--red)}
.legend{display:flex;gap:16px;font-size:13px;color:var(--muted);margin:0 0 12px;flex-wrap:wrap}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px}
.dot.folyamatos{background:var(--green)} .dot.egyszeri{background:var(--red)}

/* teendők */
.cat{margin-bottom:12px;overflow:hidden}
.chead{display:flex;align-items:center;gap:10px;padding:12px 14px;cursor:pointer;user-select:none}
.chead h3{margin:0;font-size:16px;flex:1}
.chead .cnt{font-size:13px;color:var(--muted)}
.chead .arrow{color:var(--muted);transition:transform .15s}
.cat.closed .arrow{transform:rotate(-90deg)}
.cat.closed .tasks,.cat.closed .cnote{display:none}
.cnote{padding:0 14px 8px;color:var(--muted);font-size:13px;margin-top:-4px}
.task{display:flex;align-items:flex-start;gap:10px;padding:9px 14px;border-top:1px solid var(--line)}
.task:hover{background:color-mix(in srgb,var(--accent-soft) 40%,transparent)}
.task .dotw{padding-top:6px}
.task .dotw .dot{margin:0}
.task input[type=checkbox]{margin-top:3px;flex:none}
.tmain{flex:1;min-width:0}
.ttitle{cursor:pointer}
.task.done .ttitle{text-decoration:line-through;color:var(--muted)}
.tmeta{font-size:12.5px;color:var(--muted);display:flex;gap:12px;flex-wrap:wrap;margin-top:2px}
.tmeta .late{color:var(--red);font-weight:600}

/* heti beosztás */
.weeknav{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.weeknav h2{margin:0 6px;font-size:18px}
.grid7{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.day{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px;min-height:130px;display:flex;flex-direction:column;gap:6px}
.day.today{outline:2px solid var(--accent)}
.day.wknd{background:color-mix(in srgb,var(--accent-soft) 35%,var(--card))}
.dhead{display:flex;align-items:center;gap:6px;font-size:13px}
.dhead span{color:var(--muted);flex:1}
.dhead .icon{padding:2px 7px}
.entry{border-radius:9px;padding:6px 8px;font-size:13px;cursor:default}
.entry.adm{cursor:pointer}
.entry.k-csoport{background:var(--blue-soft)} .entry.k-iroda{background:var(--purple-soft)} .entry.k-fizikai{background:var(--orange-soft)}
.entry .et{font-weight:600}
.entry .ek{font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.entry .staff{margin-top:3px;display:flex;flex-wrap:wrap;gap:3px}
.chip{background:var(--card);border-radius:99px;padding:0 7px;font-size:12px;border:1px solid var(--line)}
.sum{margin-top:18px;padding:14px}
.sum h3{margin:0 0 10px;font-size:16px}
table{border-collapse:collapse;width:100%}
th,td{padding:8px 10px;text-align:left;border-bottom:1px solid var(--line);font-size:14px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
td.n,th.n{text-align:center}
.ok{color:var(--green);font-weight:600} .warn{color:var(--amber);font-weight:600} .bad{color:var(--red);font-weight:600}

/* beszerzés */
.prow{display:grid;grid-template-columns:minmax(150px,2fr) 1fr 1fr 1fr 130px auto;gap:8px;align-items:center;padding:9px 14px;border-top:1px solid var(--line)}
.pname small{display:block;color:var(--muted);font-size:12.5px}
.pnum span{display:none;font-size:11px;color:var(--muted);text-transform:uppercase}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600}
.b-ok{background:var(--green-soft);color:var(--green)} .b-ordered{background:var(--amber-soft);color:var(--amber)}
.b-need{background:var(--red-soft);color:var(--red)} .b-none{background:var(--bg);color:var(--muted)}
.pact{display:flex;gap:4px;justify-content:flex-end}
.phead{display:grid;grid-template-columns:minmax(150px,2fr) 1fr 1fr 1fr 130px auto;gap:8px;padding:6px 14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.banner{background:var(--amber-soft);color:var(--amber);padding:10px 14px;border-radius:12px;margin-bottom:12px;font-size:14px}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(10,14,22,.5);display:grid;place-items:center;padding:16px;z-index:50;overflow:auto}
.modal{background:var(--card);border-radius:16px;width:100%;max-width:520px;box-shadow:0 20px 50px rgba(0,0,0,.3);border:1px solid var(--line)}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.mhead h3{margin:0;font-size:17px}
.mbody{padding:16px 18px}
.form{display:grid;gap:12px}
.form .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .actions{display:flex;gap:8px;justify-content:flex-end;margin-top:4px}
.form .actions .sp{flex:1}
.suggest{display:flex;flex-wrap:wrap;gap:5px}
.suggest button{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:2px 10px;font-size:12.5px;cursor:pointer}
.suggest button:hover{border-color:var(--accent)}

#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:80;display:grid;gap:8px}
.toast{background:#1c2230;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.toast.err{background:#b42318}

@media (max-width:900px){
  .grid7{grid-template-columns:repeat(2,minmax(0,1fr))}
  .phead{display:none}
  .prow{grid-template-columns:1fr 1fr 1fr;grid-template-areas:"n n s" "a b c" "x x x"}
  .pname{grid-area:n} .pst{grid-area:s;text-align:right} .pact{grid-area:x;justify-content:flex-start}
  .pnum span{display:block}
}
@media (max-width:560px){
  main{padding:14px 12px 60px}
  .top{padding:8px 12px}
  .grid7{grid-template-columns:1fr}
  .toolbar input[type=search],.toolbar select{width:100%}
  .form .row{grid-template-columns:1fr}
}
</style>
</head>
<body>
<div id="root"></div>
<div id="modal"></div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="seed.js"></script>
<script src="app.js"></script>
</body>
</html>
